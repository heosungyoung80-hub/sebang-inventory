        html, body, button, input, select, textarea, table, th, td
            { font-family: 'SEBANG', -apple-system, sans-serif !important; }
        :root { --brand-green: #1f7a3d; --brand-green-soft: #d8f4df; }
        .green-bg { background-color: var(--brand-green); }
        .green-text { color: var(--brand-green); }
        .tab-btn { font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; color: #4f6d57; white-space: nowrap; flex: 1 1 0; text-align: center; padding: 10px 4px; font-size: 12px; }
        .tab-btn.active { border-bottom: 3px solid var(--brand-green); color: var(--brand-green); }
        @media (min-width: 480px) { .tab-btn { font-size: 14px; padding: 12px 8px; } }
        @media (min-width: 768px) { .tab-btn { font-size: 16px; padding: 12px 24px; } }
        .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); padding: 12px 20px; border-radius: 10px; color: white; font-weight: bold; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 9999; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 90%; max-w: 400px; text-align: center; }
        .toast.show { opacity: 1; }
        .toast.success { background: var(--brand-green); }
        .toast.error { background: #d32f2f; }
        /* 기종별 재고 자산 분포 - 커서를 올리면 읽을 수 있는 크기까지 커짐 */
        .tm-cell {
            position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; text-align: center; overflow: hidden; cursor: pointer; border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.4);
            transition: transform .18s cubic-bezier(.22,.8,.3,1), box-shadow .18s ease, border-color .18s ease, opacity .18s ease;
        }
        .tm-cell:hover {
            transform: scale(var(--s, 1.08));
            z-index: 50; border-color: #fff; border-radius: 6px; opacity: 1 !important;
            box-shadow: 0 10px 28px rgba(0,0,0,0.35);
        }
        .tm-cell .lbl { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .tm-cell .c-name { font-size: 15px; font-weight: 700; line-height: 1.2; padding: 0 4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tm-cell .c-pct { font-size: 12.5px; margin-top: 2px; }
        .tm-cell .c-val { font-size: 12px; opacity: .9; }
        .tm-cell.mid .c-name { font-size: 12px; }
        .tm-cell.mid .c-pct, .tm-cell.mid .c-val { display: none; }
        .tm-cell.tiny .c-name { font-size: 8px; }
        .tm-cell.tiny .c-pct, .tm-cell.tiny .c-val { font-size: 7px; display: none; }
        .tm-cell.tiny .lbl { opacity: 0; transition: opacity .15s ease; }
        .tm-cell.tiny:hover .lbl { opacity: 1; }
        .tm-cell.tiny:hover .c-pct, .tm-cell.tiny:hover .c-val { display: block; }

        /* 모바일 스크롤바 숨김 처리 */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        /* QR 라벨 인쇄 전용 스타일 */
        #printArea { display: none; }
        .qr-label { width: 180px; padding: 8px; border: 1px dashed #999; text-align: center; display: inline-flex; flex-direction: column; align-items: center; break-inside: avoid; margin: 4px; }
        .qr-label .part-id { font-weight: bold; font-size: 13px; margin-top: 4px; }
        .qr-label .part-name { font-size: 10px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { display: flex; flex-wrap: wrap; position: absolute; top: 0; left: 0; width: 100%; }
        }
    </style>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxU7ZA41jrFuADm5Q3eXlsGjFKguiY8DJYE_pPwwQWCsq0YMdEO2wNkjLHN0OJ3pdFG/exec";

        let masterData = [];
        let categoryChart = null;
        let lowStockItemsGlobal = [];
        let longStockItemsGlobal = [];
        let categoryValueMap = {};
        let categoryQtyMap = {};
        let selectedCategories = new Set();
        let showAllItems = false;
        
        let html5QrCode = null;
        let isCameraScanning = false;

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function showTab(tabId, evt) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            evt.target.classList.add('active');

            const actionButtons = document.getElementById('action-buttons');
            
            if (tabId === 'scan') {
                actionButtons.classList.remove('hidden');
                
                // 후면 카메라 자동 실행
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                    const qrConfig = { fps: 15, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
                    
                    html5QrCode.start(
                        { facingMode: "environment" }, 
                        qrConfig, 
                        onScanSuccess
                    ).then(() => {
                        isCameraScanning = true;
                    }).catch((err) => {
                        console.error("카메라 실행 에러:", err);
                        const errName = (err && err.name) ? err.name : '';
                        const errMsg = (err && err.message) ? err.message : String(err);
                        document.getElementById('reader').innerHTML = `
                            <div class="p-6 text-center">
                                <p class="text-red-500 font-bold mb-2">카메라 접근 실패</p>
                                <p class="text-xs text-gray-700 font-bold mb-2">${errName} ${errMsg}</p>
                                <p class="text-xs text-gray-500 text-left">1. 주소창이 https:// 로 시작하는지 확인하세요.<br>2. 브라우저 설정에서 카메라 권한을 '허용'으로 변경하세요.<br>3. 카카오톡/네이버 등 인앱 브라우저가 아닌 크롬/사파리에서 여세요.</p>
                            </div>
                        `;
                    });
                }
            } else {
                actionButtons.classList.add('hidden');
                
                // 탭 이동 시 배터리/발열 절약을 위해 카메라 점유 해제
                if (html5QrCode && isCameraScanning) {
                    html5QrCode.stop().then(() => {
                        html5QrCode.clear();
                        html5QrCode = null;
                        isCameraScanning = false;
                    }).catch(console.error);
                }
            }

            if (tabId === 'logs') {
                loadRecentLogs();
            }
        }

        function onScanSuccess(decodedText) {
            document.getElementById('partId').value = decodedText;
            updateScanItemInfo();
            document.getElementById('qty').focus(); 
        }

        // 품번 입력/스캔 시 품명·현재고를 바로 보여줌 (오인식/오입력 확인용)
        function updateScanItemInfo() {
            const partId = document.getElementById('partId').value.trim();
            const infoBox = document.getElementById('scanItemInfo');
            if (!partId) { infoBox.classList.add('hidden'); return; }

            const d = masterData.find(item => String(item.partId) === String(partId));
            infoBox.classList.remove('hidden');
            if (!d) {
                infoBox.className = 'p-3 rounded-lg text-sm bg-red-50 border border-red-200 text-red-600 font-bold';
                infoBox.textContent = '⚠️ 등록되지 않은 품번입니다. 품번을 다시 확인하세요.';
            } else {
                infoBox.className = 'p-3 rounded-lg text-sm bg-[#f2f9f4] border border-[#d1e7d6]';
                infoBox.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <span class="font-bold text-[#1f7a3d]">${d.partName}</span>
                        <span class="flex-shrink-0 bg-[#1f7a3d] text-white text-xs font-bold px-2 py-1 rounded">📍 ${d.location || '위치 미등록'}</span>
                    </div>
                    <span class="text-gray-500 text-xs">현재고 ${d.stock}${d.unit || ''} · 기종 ${d.category || '-'}</span>`;
            }
        }

        async function loadDashboard() {
            try {
                const res = await fetch(WEB_APP_URL);
                const data = await res.json();
                if (data.error) { showToast('로드 실패: ' + data.error, 'error'); return; }
                masterData = data;
                renderDashboard(masterData);
            } catch (err) {
                console.error(err);
                showToast('서버 연동 실패.', 'error');
            }
        }

        function renderDashboard(data) {
            const totalValue = data.reduce((sum, d) => sum + (Number(d.stock) || 0) * (Number(d.price) || 0), 0);
            document.getElementById('kpi-total-value').textContent = '₩ ' + totalValue.toLocaleString();

            lowStockItemsGlobal = data.filter(d => Number(d.stock) < Number(d.safetyStock));
            document.getElementById('kpi-low-stock').textContent = lowStockItemsGlobal.length + '건';

            categoryValueMap = {};
            categoryQtyMap = {};
            data.forEach(d => {
                const cat = d.category || '미분류';
                const qty = Number(d.stock) || 0;
                const value = qty * (Number(d.price) || 0);
                categoryValueMap[cat] = (categoryValueMap[cat] || 0) + value;
                categoryQtyMap[cat] = (categoryQtyMap[cat] || 0) + qty;
            });

            selectedCategories.forEach(cat => { if (!(cat in categoryValueMap)) selectedCategories.delete(cat); });

            renderCategoryChart();
            updateCategoryKpi();
            renderCategoryListPanel();

            const now = new Date();
            longStockItemsGlobal = data
                .map(d => {
                    const last = d.lastDate ? new Date(d.lastDate) : null;
                    const days = last ? Math.floor((now - last) / (1000 * 60 * 60 * 24)) : null;
                    return { ...d, days };
                })
                .filter(d => d.days !== null && d.days >= 365)
                .sort((a, b) => b.days - a.days);

            document.getElementById('kpi-long-stock').textContent = longStockItemsGlobal.length + '건';
        }

        function formatMillion(value) {
            return (value / 1000000).toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '백만';
        }

        function squarify(items, x, y, w, h) {
            const result = [];
            let remaining = items.slice();
            function worstRatio(row, side) {
                const sum = row.reduce((s, it) => s + it.area, 0);
                const max = Math.max(...row.map(it => it.area));
                const min = Math.min(...row.map(it => it.area));
                return Math.max((side * side * max) / (sum * sum), (sum * sum) / (side * side * min));
            }
            while (remaining.length > 0) {
                const shortSide = Math.min(w, h);
                let row = [remaining[0]];
                let bestRatio = worstRatio(row, shortSide);
                let i = 1;
                while (i < remaining.length) {
                    const testRow = row.concat([remaining[i]]);
                    const testRatio = worstRatio(testRow, shortSide);
                    if (testRatio <= bestRatio) { row = testRow; bestRatio = testRatio; i++; } 
                    else break;
                }
                const rowArea = row.reduce((s, it) => s + it.area, 0);
                if (w >= h) {
                    const rowWidth = rowArea / h;
                    let curY = y;
                    row.forEach(it => {
                        const itHeight = it.area / rowWidth;
                        result.push({ ...it, x, y: curY, w: rowWidth, h: itHeight });
                        curY += itHeight;
                    });
                    x += rowWidth; w -= rowWidth;
                } else {
                    const rowHeight = rowArea / w;
                    let curX = x;
                    row.forEach(it => {
                        const itWidth = it.area / rowHeight;
                        result.push({ ...it, x: curX, y, w: itWidth, h: rowHeight });
                        curX += itWidth;
                    });
                    y += rowHeight; h -= rowHeight;
                }
                remaining = remaining.slice(row.length);
            }
            return result;
        }

        function renderCategoryChart() {
            const container = document.getElementById('chart-type');
            const palette = ['#1f7a3d', '#3fa562', '#7fcf99', '#d4a017', '#8e6fce', '#4f6d57', '#6b9bd1', '#c97b4a', '#5a8f6f', '#b08968', '#7a6ba0', '#4a90a4'];
            const entries = Object.entries(categoryValueMap).sort((a, b) => b[1] - a[1]);
            const total = entries.reduce((sum, [, v]) => sum + v, 0);

            if (total === 0) {
                container.innerHTML = '<div class="w-full h-full flex items-center justify-center text-xs text-gray-400">데이터 없음</div>';
                return;
            }

            const cw = container.clientWidth || 300;
            const ch = container.clientHeight || 250;
            const items = entries.map(([category, value], idx) => ({ category, value, area: value * (cw * ch / total), color: palette[idx % palette.length] }));
            const rects = squarify(items, 0, 0, cw, ch);

            container.innerHTML = rects.map(r => {
                const pct = (r.value / total) * 100;
                const isSelected = selectedCategories.has(r.category);
                const ring = isSelected ? 'box-shadow: inset 0 0 0 3px white, inset 0 0 0 5px #1f7a3d; z-index:2;' : '';
                const dim = (selectedCategories.size > 0 && !isSelected) ? 'opacity:0.45;' : '';
                // 칸 크기에 따라 글자 표시 단계를 나눔
                const tier = (r.w > 90 && r.h > 62) ? 'full' : ((r.w > 52 && r.h > 30) ? 'mid' : 'tiny');
                // 커서를 올렸을 때 최소 가로 130 / 세로 84 는 확보되도록 배율 계산 (최대 2.6배)
                const zoom = Math.min(2.6, Math.max(1.06, 130 / r.w, 84 / r.h));
                const labelHtml = `<span class="lbl"><span class="c-name">${r.category}</span><span class="c-pct">${pct.toFixed(1)}%</span><span class="c-val">${formatMillion(r.value)}</span></span>`;

                return `<div onclick="toggleCategory('${r.category.replace(/'/g, "\\'")}')" class="tm-cell ${tier}" style="left:${r.x}px; top:${r.y}px; width:${r.w}px; height:${r.h}px; background-color:${r.color}; --s:${zoom.toFixed(2)}; ${ring} ${dim}">${labelHtml}</div>`;
            }).join('');
        }

        function toggleCategory(category) {
            showAllItems = false;
            if (selectedCategories.has(category)) selectedCategories.delete(category);
            else selectedCategories.add(category);
            renderCategoryChart(); updateCategoryKpi(); renderCategoryListPanel();
        }

        function selectAllCategories() {
            showAllItems = false;
            selectedCategories = new Set(Object.keys(categoryValueMap));
            renderCategoryChart(); updateCategoryKpi(); renderCategoryListPanel();
        }

        function clearAllCategories() {
            selectedCategories.clear();
            renderCategoryChart(); updateCategoryKpi(); renderCategoryListPanel();
        }

        function updateCategoryKpi() {
            const el = document.getElementById('kpi-top-category');
            if (selectedCategories.size === 0) {
                const topCategory = Object.entries(categoryValueMap).sort((a, b) => b[1] - a[1])[0];
                el.textContent = topCategory ? `${topCategory[0]}` : '-';
                return;
            }
            const selectedList = Array.from(selectedCategories);
            el.textContent = selectedList.length <= 2 ? selectedList.join(', ') : `${selectedList.length}개 선택됨`;
        }

        function renderCategoryListPanel() {
            const emptyEl = document.getElementById('category-list-empty');
            const wrapEl = document.getElementById('category-list-wrap');
            const tbody = document.getElementById('category-list-body');
            const toggleBtn = document.getElementById('category-list-toggle-all');
            
            const searchInput = document.getElementById('searchInput');
            const searchKeyword = searchInput ? searchInput.value.trim().toLowerCase() : '';

            toggleBtn.textContent = showAllItems ? '선택 취소' : '전체 보기';

            if (!showAllItems && selectedCategories.size === 0 && searchKeyword === '') {
                emptyEl.classList.remove('hidden'); 
                wrapEl.classList.add('hidden'); 
                return;
            }

            emptyEl.classList.add('hidden'); 
            wrapEl.classList.remove('hidden');

            let targetData = masterData;
            if (!showAllItems && selectedCategories.size > 0) {
                targetData = masterData.filter(d => selectedCategories.has(d.category || '미분류'));
            }

            if (searchKeyword !== '') {
                targetData = targetData.filter(d => 
                    String(d.partId).toLowerCase().includes(searchKeyword) || 
                    String(d.partName).toLowerCase().includes(searchKeyword)
                );
            }

            const items = targetData.sort((a, b) => (Number(b.stock) * Number(b.price)) - (Number(a.stock) * Number(a.price)));

            if (items.length === 0) { 
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-400">검색 결과가 없습니다</td></tr>'; 
                return; 
            }

            tbody.innerHTML = items.map(d => `
                <tr class="border-b border-gray-100 hover:bg-[#f2f9f4] cursor-pointer" onclick="openItemDetailModal('${String(d.partId).replace(/'/g, "\\'")}')">
                    <td class="p-2">${d.partId}</td>
                    <td class="p-2 truncate max-w-[100px]">${d.partName}</td>
                    <td class="p-2">${d.category || '-'}</td>
                    <td class="p-2 font-bold">${d.stock}</td>
                    <td class="p-2 text-[#1f7a3d]">${formatMillion((Number(d.stock)||0)*(Number(d.price)||0))}</td>
                    <td class="p-2" onclick="event.stopPropagation()"><button onclick="openQrLabelModal('${String(d.partId).replace(/'/g, "\\'")}','${String(d.partName||'').replace(/'/g, "\\'")}')" class="text-[10px] font-bold text-white bg-gray-600 px-2 py-1 rounded">QR</button></td>
                </tr>`).join('');
        }

        function toggleShowAllItems() {
            showAllItems = !showAllItems;
            if (showAllItems) { selectedCategories.clear(); renderCategoryChart(); updateCategoryKpi(); }
            renderCategoryListPanel();
        }

        function openLowStockModal() {
            const tbody = document.getElementById('lowStockModalBody');
            if (lowStockItemsGlobal.length === 0) tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center">부족 품목 없음</td></tr>';
            else tbody.innerHTML = lowStockItemsGlobal.map(d => `
                <tr class="border-b border-gray-100 cursor-pointer" onclick="openItemDetailModal('${String(d.partId).replace(/'/g, "\\'")}')">
                    <td class="p-2">${d.partId}</td><td class="p-2 truncate max-w-[120px]">${d.partName}</td><td class="p-2">${d.category||'-'}</td><td class="p-2 text-red-600 font-bold">${d.stock}</td><td class="p-2">${d.safetyStock}</td><td class="p-2 text-red-500">${Number(d.safetyStock)-Number(d.stock)}</td>
                </tr>`).join('');
            document.getElementById('lowStockModal').classList.remove('hidden');
        }
        function closeLowStockModal() { document.getElementById('lowStockModal').classList.add('hidden'); }

        function openLongStockModal() {
            const tbody = document.getElementById('longStockModalBody');
            if (longStockItemsGlobal.length === 0) tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center">장기재고 없음</td></tr>';
            else tbody.innerHTML = longStockItemsGlobal.map(d => `
                <tr class="border-b border-gray-100 cursor-pointer" onclick="openItemDetailModal('${String(d.partId).replace(/'/g, "\\'")}')">
                    <td class="p-2">${d.partId}</td><td class="p-2 truncate max-w-[120px]">${d.partName}</td><td class="p-2">${d.stock}</td><td class="p-2">₩${Number(d.price||0).toLocaleString()}</td><td class="p-2 text-orange-600 font-bold">${d.days}일</td>
                </tr>`).join('');
            document.getElementById('longStockModal').classList.remove('hidden');
        }
        function closeLongStockModal() { document.getElementById('longStockModal').classList.add('hidden'); }

        // ===== 데이터 관리 모달 & 최근 입출고 현황 =====
        let recentLogsAll = [];
        let recentLogsShown = 0;
        const RECENT_LOGS_PAGE = 20;

        function openDataModal() {
            document.getElementById('dataModal').classList.remove('hidden');
        }
        function closeDataModal(evt) {
            if (evt && evt.target !== evt.currentTarget) return;
            document.getElementById('dataModal').classList.add('hidden');
        }

        async function loadRecentLogs() {
            const listEl = document.getElementById('recentLogsList');
            const moreBtn = document.getElementById('recentLogsMoreBtn');
            listEl.innerHTML = '<p class="text-xs text-gray-400 text-center p-4">불러오는 중...</p>';
            moreBtn.classList.add('hidden');
            try {
                // 품번(partId) 없이 호출 → 전체 최근 입출고 이력을 반환한다고 가정
                // (GAS doGet에 이 동작이 없다면 백엔드에 추가가 필요합니다)
                const res = await fetch(`${WEB_APP_URL}?action=history`);
                const data = await res.json();
                if (!Array.isArray(data)) {
                    listEl.innerHTML = '<p class="text-xs text-red-500 text-center p-4">이력을 불러오지 못했습니다. (백엔드에 전체 이력 조회 기능이 필요할 수 있습니다)</p>';
                    return;
                }
                recentLogsAll = data.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
                recentLogsShown = 0;
                listEl.innerHTML = '';
                if (recentLogsAll.length === 0) {
                    listEl.innerHTML = '<p class="text-xs text-gray-400 text-center p-4">입출고 이력이 없습니다.</p>';
                    return;
                }
                showMoreRecentLogs();
            } catch (err) {
                listEl.innerHTML = '<p class="text-xs text-red-500 text-center p-4">서버 통신 실패</p>';
                console.error(err);
            }
        }

        function showMoreRecentLogs() {
            const listEl = document.getElementById('recentLogsList');
            const moreBtn = document.getElementById('recentLogsMoreBtn');
            const nextCount = Math.min(recentLogsShown + RECENT_LOGS_PAGE, recentLogsAll.length);
            const newItems = recentLogsAll.slice(recentLogsShown, nextCount);

            newItems.forEach(h => {
                const row = document.createElement('div');
                row.className = 'flex justify-between items-center py-3 text-xs';
                row.innerHTML = `
                    <div class="min-w-0 pr-2">
                        <p class="font-bold truncate">${h.partId} <span class="text-gray-400 font-normal">${h.partName || ''}</span></p>
                        <p class="text-gray-400 mt-0.5">${h.date ? new Date(h.date).toLocaleString('ko-KR') : '-'}</p>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <p class="font-bold ${h.type === '입고' ? 'text-green-600' : 'text-red-600'}">${h.type} ${h.qty}</p>
                        <p class="text-gray-400 mt-0.5">재고 ${h.closingStock ?? '-'}</p>
                    </div>`;
                listEl.appendChild(row);
            });

            recentLogsShown = nextCount;
            if (recentLogsShown >= recentLogsAll.length) {
                moreBtn.classList.add('hidden');
            } else {
                moreBtn.classList.remove('hidden');
                moreBtn.textContent = `+ 20개 더 보기 (${recentLogsAll.length - recentLogsShown}개 남음)`;
            }
        }

        function copyPartId(partId) {
            const text = String(partId);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('품번이 복사되었습니다.', 'success');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus(); ta.select();
            try {
                document.execCommand('copy');
                showToast('품번이 복사되었습니다.', 'success');
            } catch (e) {
                showToast('복사에 실패했습니다.', 'error');
            }
            document.body.removeChild(ta);
        }

        async function openItemDetailModal(partId) {
            const d = masterData.find(item => String(item.partId) === String(partId));
            if (!d) return;
            const body = document.getElementById('itemDetailBody');
            const imageBlock = d.imageUrl ? `<img src="${d.imageUrl}" class="w-full h-48 object-cover rounded-xl bg-gray-100">` : `<div class="w-full h-32 flex items-center justify-center bg-gray-100 rounded-xl text-4xl">📦</div>`;
            const safePartId = String(d.partId).replace(/'/g, "\\'");
            
            body.innerHTML = `
                ${imageBlock}
                <div class="grid grid-cols-2 gap-y-4 gap-x-2 mt-5 text-sm">
                    <div>
                        <p class="text-[10px] text-gray-400">품번</p>
                        <div class="flex items-center gap-2">
                            <p class="font-bold text-base">${d.partId}</p>
                            <button onclick="copyPartId('${safePartId}')" title="품번 복사" class="text-gray-400 hover:text-[#1f7a3d] p-1 -m-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            </button>
                        </div>
                    </div>
                    <div><p class="text-[10px] text-gray-400">품명</p><p class="font-bold text-base">${d.partName}</p></div>
                    <div><p class="text-[10px] text-gray-400">기종</p><p class="font-bold">${d.category || '-'}</p></div>
                    <div><p class="text-[10px] text-gray-400">렉위치</p><p class="font-bold">${d.location || '-'}</p></div>
                    <div><p class="text-[10px] text-gray-400">현재 수량</p><p class="font-bold text-lg text-[#1f7a3d]">${d.stock}${d.unit || ''}</p></div>
                    <div><p class="text-[10px] text-gray-400">안전재고</p><p class="font-bold">${d.safetyStock ?? '-'}</p></div>
                </div>
                <button onclick="openQrLabelModal('${safePartId}','${String(d.partName||'').replace(/'/g, "\\'")}')" class="w-full mt-4 bg-gray-600 text-white py-3 rounded-xl font-bold text-sm">📎 이 품목 QR 라벨 보기/인쇄</button>
                <div class="mt-6 border-t border-gray-100 pt-4">
                    <h4 class="text-sm font-bold text-[#1f7a3d] mb-3">최근 입출고 이력</h4>
                    <div id="itemHistoryTable" class="text-xs text-gray-500">데이터 로딩 중...</div>
                </div>
            `;
            document.getElementById('itemDetailModal').classList.remove('hidden');

            try {
                const res = await fetch(`${WEB_APP_URL}?action=history&partId=${encodeURIComponent(partId)}`);
                const history = await res.json();
                const el = document.getElementById('itemHistoryTable');
                if (!Array.isArray(history) || history.length === 0) el.innerHTML = '<p>이력 없음</p>';
                else el.innerHTML = `<table class="w-full text-left whitespace-nowrap"><thead class="bg-gray-50"><tr><th class="p-2">일시</th><th class="p-2">구분</th><th class="p-2">수량</th><th class="p-2">재고</th></tr></thead><tbody>${history.slice(0,5).map(h => `<tr class="border-b border-gray-100"><td class="p-2">${h.date?new Date(h.date).toLocaleDateString('ko-KR'):'-'}</td><td class="p-2 ${h.type==='입고'?'text-green-600':'text-red-600'} font-bold">${h.type}</td><td class="p-2">${h.qty}</td><td class="p-2">${h.closingStock}</td></tr>`).join('')}</tbody></table>`;
            } catch (err) { document.getElementById('itemHistoryTable').textContent = '로드 실패'; }
        }
        function closeItemDetailModal() { document.getElementById('itemDetailModal').classList.add('hidden'); }

        // ===== QR 라벨 생성/인쇄 =====
        let currentQrItem = null;

        function openQrLabelModal(partId, partName) {
            currentQrItem = { partId, partName };
            document.getElementById('qrLabelPartId').textContent = partId;
            document.getElementById('qrLabelPartName').textContent = partName || '';
            const wrap = document.getElementById('qrLabelCanvasWrap');
            wrap.innerHTML = '';
            document.getElementById('qrLabelModal').classList.remove('hidden'); // 먼저 팝업부터 연다

            if (typeof QRCode === 'undefined') {
                wrap.innerHTML = '<p class="text-red-500 text-xs font-bold p-4">QR 라이브러리 로드 실패<br>(인터넷 연결을 확인하고 새로고침 해주세요)</p>';
                return;
            }
            try {
                new QRCode(wrap, { text: String(partId), width: 180, height: 180, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
            } catch (e) {
                wrap.innerHTML = `<p class="text-red-500 text-xs font-bold p-4">QR 생성 오류: ${e.message}</p>`;
                console.error(e);
            }
        }
        function closeQrLabelModal(evt) {
            if (evt && evt.target !== evt.currentTarget) return;
            document.getElementById('qrLabelModal').classList.add('hidden');
        }

        function printSingleQrLabel() {
            if (!currentQrItem) return;
            renderPrintLabels([currentQrItem]);
        }

        function printAllQrLabels() {
            if (typeof QRCode === 'undefined') { showToast('QR 라이브러리 로드 실패. 새로고침 후 다시 시도하세요.', 'error'); return; }
            // 현재 화면(검색/선택 필터)에 표시된 품목 기준으로 라벨 생성
            const searchInput = document.getElementById('searchInput');
            const searchKeyword = searchInput ? searchInput.value.trim().toLowerCase() : '';
            let targetData = masterData;
            if (!showAllItems && selectedCategories.size > 0) {
                targetData = masterData.filter(d => selectedCategories.has(d.category || '미분류'));
            }
            if (searchKeyword !== '') {
                targetData = targetData.filter(d =>
                    String(d.partId).toLowerCase().includes(searchKeyword) ||
                    String(d.partName).toLowerCase().includes(searchKeyword)
                );
            }
            if (targetData.length === 0) { showToast('인쇄할 품목이 없습니다.', 'error'); return; }
            if (targetData.length > 200 && !confirm(`${targetData.length}개 품목을 모두 인쇄하시겠습니까? 시간이 걸릴 수 있습니다.`)) return;
            renderPrintLabels(targetData.map(d => ({ partId: d.partId, partName: d.partName })));
        }

        function renderPrintLabels(list) {
            const printArea = document.getElementById('printArea');
            printArea.innerHTML = '';
            list.forEach(item => {
                const labelDiv = document.createElement('div');
                labelDiv.className = 'qr-label';
                const qrWrap = document.createElement('div');
                labelDiv.appendChild(qrWrap);
                const idP = document.createElement('p');
                idP.className = 'part-id';
                idP.textContent = item.partId;
                const nameP = document.createElement('p');
                nameP.className = 'part-name';
                nameP.textContent = item.partName || '';
                labelDiv.appendChild(idP);
                labelDiv.appendChild(nameP);
                printArea.appendChild(labelDiv);
                new QRCode(qrWrap, { text: String(item.partId), width: 130, height: 130, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
            });
            setTimeout(() => window.print(), 400); // 렌더링(캔버스→이미지 변환) 여유시간 확보 후 인쇄
        }

        async function submitData(type) {
            const partId = document.getElementById('partId').value.trim();
            const qty = document.getElementById('qty').value.trim();
            if (!partId || !qty) { showToast('품번과 수량을 확인하세요.', 'error'); return; }

            // 출고 시 현재고를 초과하는지 사전 검증 (음수 재고 방지)
            if (type === '출고') {
                const d = masterData.find(item => String(item.partId) === String(partId));
                if (d) {
                    const currentStock = Number(d.stock) || 0;
                    const requestQty = Number(qty) || 0;
                    if (requestQty > currentStock) {
                        alert(`⚠️ 출고 불가\n\n품번: ${partId}\n품명: ${d.partName}\n현재고: ${currentStock}${d.unit || ''}\n요청 출고: ${requestQty}${d.unit || ''}\n\n현재고보다 많은 수량은 출고할 수 없습니다.`);
                        showToast(`출고 불가: 현재고(${currentStock}) 초과`, 'error');
                        return; // 서버로 전송하지 않고 중단
                    }
                }
            }

            const btnIn = document.getElementById('btn-in');
            const btnOut = document.getElementById('btn-out');
            const clickedBtn = type === '입고' ? btnIn : btnOut;

            // 처리 중 표시: 두 버튼 모두 비활성화 + 클릭한 버튼에 스피너 표시 (중복 제출 방지)
            btnIn.disabled = true; btnOut.disabled = true;
            clickedBtn.innerHTML = '<span class="inline-block w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin align-middle"></span> 처리 중...';

            const payload = { transactionId: 'TX-'+Date.now(), partId, qty, type, user: '영' };

            try {
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if (result.result === '성공') {
                    showToast(`${type} 처리 완료 (현재고: ${result.newStock})`, 'success');
                    document.getElementById('partId').value = ''; document.getElementById('qty').value = '';
                    document.getElementById('scanItemInfo').classList.add('hidden');
                    loadDashboard();
                } else showToast('오류: ' + result.error, 'error');
            } catch (err) {
                showToast('서버 통신 실패', 'error');
            } finally {
                // 성공/실패 관계없이 버튼 원상 복구
                btnIn.disabled = false; btnOut.disabled = false;
                btnIn.textContent = '입고'; btnOut.textContent = '출고';
            }
        }

        function downloadCsv() {
            if (masterData.length===0) return;
            const rows = masterData.map(d => [d.partId, d.partName, d.stock, d.category].join(',')).join('\n');
            const blob = new Blob(['\uFEFF품번,품명,현재고,기종\n' + rows], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = '재고.csv'; link.click();
        }
        function uploadCsv() { showToast('콘솔에서 미리보기를 확인하세요.', 'success'); }

        window.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
